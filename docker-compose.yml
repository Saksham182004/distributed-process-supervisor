services:
  coordinator:
    image: node:18
    working_dir: /app
    volumes:
      - ./coordinator:/app
    command: node src/index.js
    ports:
      - "3000:3000"
    networks:
      - cluster-network
    depends_on:
      - redis 
    environment:
      - REDIS_URL=redis://redis:6379


  coordinator-2:
    image: node:18
    working_dir: /app
    volumes:
      - ./coordinator:/app
    command: node src/index.js
    ports:
      - "3001:3000"
    networks:
      - cluster-network
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379


  worker-1:
    build: ./worker-agent
    volumes:
      - ./worker-agent/src:/app
    working_dir: /app
    command: ./supervisor
    environment:
      - WORKER_ID=worker-1
      - COORDINATOR_URL=http://coordinator:3000/heartbeat,http://coordinator-2:3000/heartbeat
    networks:
      - cluster-network

  worker-2:
    build: ./worker-agent
    volumes:
      - ./worker-agent/src:/app
    working_dir: /app
    command: ./supervisor
    environment:
      - WORKER_ID=worker-2
      - COORDINATOR_URL=http://coordinator:3000/heartbeat,http://coordinator-2:3000/heartbeat
    networks:
      - cluster-network

  worker-3:
    build: ./worker-agent
    volumes:
      - ./worker-agent/src:/app
    working_dir: /app
    command: ./supervisor
    environment:
      - WORKER_ID=worker-3
      - COORDINATOR_URL=http://coordinator:3000/heartbeat,http://coordinator-2:3000/heartbeat
    networks:
      - cluster-network

  worker-4:
    build: ./worker-agent
    volumes:
      - ./worker-agent/src:/app
    working_dir: /app
    command: ./supervisor
    environment:
      - WORKER_ID=worker-4
      - COORDINATOR_URL=http://coordinator:3000/heartbeat,http://coordinator-2:3000/heartbeat
    networks:
      - cluster-network

  worker-5:
    build: ./worker-agent
    volumes:
      - ./worker-agent/src:/app
    working_dir: /app
    command: ./supervisor
    environment:
      - WORKER_ID=worker-5
      - COORDINATOR_URL=http://coordinator:3000/heartbeat,http://coordinator-2:3000/heartbeat
    networks:
      - cluster-network

  dashboard:
    image: node:18
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules   # keep the container's linux node_modules separate from the host's
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - cluster-network

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - cluster-network

networks:
  cluster-network:
    driver: bridge
  
